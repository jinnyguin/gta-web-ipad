<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>game</title>
<style>
	html, body { margin: 0; height: 100%; background: #000; color: #ccc; font: 12px monospace; overflow: hidden; }
	#canvas { display: block; position: absolute; left: 0; top: 0; width: 100vw; height: 100vh; background: #000; }
	@font-face { font-family: 'Chalet'; src: url('/mirror/playgta.com/b/8b0b5899ed/title/chalet.woff') format('woff'); }
	#loading { position: fixed; inset: 0; background: #000; overflow: hidden; transition: opacity .8s; z-index: 5; }
	#loading.done { opacity: 0; pointer-events: none; }
	#ls-stage { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; transform-origin: 0 0; overflow: hidden; font: 12px Chalet, sans-serif; color: #fff; }
	#ls-screens { position: absolute; inset: 0; }
	.ls-screen { position: absolute; inset: 0; }
	.ls-cam { position: absolute; inset: 0; perspective: 1229px; perspective-origin: 640px 360px; }
	.ls-layer { position: absolute; left: 0; top: 0; transform-origin: 0 0; background-size: 100% 100%; }
	#ls-logo { position: absolute; left: 95px; top: 492.5px; width: 186px; height: 186px; }
	#ls-bars { position: absolute; right: 96px; top: 642px; display: flex; gap: 3px; }
	.ls-bar { height: 24px; padding: 0 6px; display: flex; align-items: center; background: rgba(0, 0, 0, .706); border-radius: 2.4px; white-space: nowrap; }
	#modes { gap: 8px; }
	#modes button { display: flex; align-items: center; height: 24px; padding: 0; border: 0; background: none; color: #fff; font: 12px Chalet, sans-serif; cursor: pointer; }
	#modes button:disabled { cursor: default; }
	#modes button[hidden] { display: none; }
	#modes.ask button:not(:disabled) .ls-key { animation: ls-ask 1.2s ease-in-out infinite; }
	@keyframes ls-ask { 50% { opacity: .35; } }
	.ls-key { margin-left: 4px; min-width: 12px; height: 15px; padding: 0 4px; line-height: 16px; border-radius: 2px; background: #fff; color: #000; font-size: 10px; text-transform: uppercase; }
	.ls-spin { flex: none; width: 22px; height: 22px; margin-left: 2px; background: url('/mirror/playgta5.com/b/8b0b5899ed/title/spinner.png') center / 24px 24px no-repeat; animation: ls-spin 2s steps(60) infinite; }
	@keyframes ls-spin { from { transform: rotate(0deg) scaleX(-1); } to { transform: rotate(-360deg) scaleX(-1); } }
	#label { text-shadow: .85px .85px 1px rgba(0, 0, 0, .45); }
	#pct { margin-left: 15px; font-variant-numeric: tabular-nums; }
	#ls-log { position: absolute; left: 8px; right: 8px; bottom: 6px; display: flex; flex-direction: column; align-items: center; font: 10px/1.35 Consolas, monospace; color: rgba(190, 190, 190, .75); text-shadow: 0 0 2px #000, 1px 1px 1px #000; white-space: pre; pointer-events: none; }
	#console { max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
	#data { color: #6a9; }
	#bar { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(255, 255, 255, .08); }
	#fill { height: 100%; width: 0; background: #7cc576; }
	#hud { position: fixed; left: 8px; bottom: 8px; max-width: 60vw; white-space: pre-wrap; opacity: .8; pointer-events: none; }
	#hud.startup-error { z-index: 6; max-width: calc(100vw - 36px); padding: 8px 10px; color: #f99; background: #201517; opacity: 1; }
	#fps { position: fixed; left: 8px; top: 6px; display: none; color: #0f0; font: bold 18px/1.2 Consolas, monospace; font-variant-numeric: tabular-nums; text-shadow: 1px 1px 2px #000, 0 0 3px #000; pointer-events: none; z-index: 10; }
	#local-zip-settings { position: fixed; top: 8px; right: 8px; z-index: 20; max-width: min(360px, calc(100vw - 32px)); padding: 8px; color: #ddd; background: #17191eee; border: 1px solid #555; }
	#local-zip-settings summary { cursor: pointer; }
	#local-zip-settings form { display: grid; gap: 8px; margin-top: 8px; }
	#local-zip-settings label { display: grid; gap: 3px; }
	#local-zip-settings input { box-sizing: border-box; width: 100%; padding: 5px; }
	#local-zip-settings button { padding: 5px 8px; }
	#cache-setting { display: flex !important; align-items: center; gap: 6px !important; }
	#cache-setting input { appearance: none; flex: none; width: 34px; height: 18px; margin: 0; border: 1px solid #777; border-radius: 10px; background: #555; cursor: pointer; transition: background .15s; }
	#cache-setting input::after { content: ''; display: block; width: 14px; height: 14px; margin: 1px; border-radius: 50%; background: #ddd; transition: transform .15s; }
	#cache-setting input:checked { background: #368b55; }
	#cache-setting input:checked::after { transform: translateX(16px); }
	#cache-setting input:focus-visible { outline: 2px solid #9bd; outline-offset: 2px; }
</style>
</head>
<body>

<canvas id="canvas" width="800" height="600" tabindex="-1"></canvas>
<div id="hud"></div>
<details id="local-zip-settings"><summary>Startup and local ZIP settings</summary>
	<form id="local-zip-form">
		<label id="cache-setting"><input id="cache-game-files" type="checkbox"> Cache downloaded game files on this device</label>
	</form>
</details>
<div id="loading"><div id="ls-stage"><div id="ls-screens"></div><img id="ls-logo" src="/mirror/playgta5.com/b/8b0b5899ed/title/logo.png" alt=""><div id="ls-bars"><div id="modes" class="ls-bar"><button data-act="back"></button><button data-act="map5"></button><button data-act="map6"></button><button data-act="sandbox"></button><button data-act="story"></button></div><div class="ls-bar"><span id="label">Starting...</span><span id="pct">0%</span><i class="ls-spin"></i></div></div></div><div id="ls-log"><div id="data"></div><div id="console"></div></div><div id="bar"><div id="fill"></div></div></div>
<div id="fps"></div>

<script type="module">
const q = new URLSearchParams(location.search);
const localZipMode = false;
const LOCAL_ZIP_PART1_KEY = 'gta-local-zip-part1-base';
const LOCAL_ZIP_REST_KEY = 'gta-local-zip-rest-base';
const CACHE_MODE_KEY = 'gta-cache-game-files';
const cacheEnabled = q.has('cache')
	? q.get('cache') !== '0'
	: !(q.get('nocache') || q.get('nosw')) && localStorage.getItem(CACHE_MODE_KEY) !== '0';

function normalizeZipBase(value) {
    const url = new URL(value);
    if (!['http:', 'https:'].includes(url.protocol) || url.username || url.password || url.search || url.hash) {
        throw new Error('Use an HTTP or HTTPS URL without credentials, query, or fragment.');
    }
    if (url.pathname.split('/').some((part) => part === '..')) throw new Error('ZIP paths cannot contain "..".');
    url.pathname = url.pathname.replace(/\/+$/, '') + '/';
    return url.href;
}
function getLocalZipBases() {
	const part1 = localStorage.getItem(LOCAL_ZIP_PART1_KEY);
	const rest = localStorage.getItem(LOCAL_ZIP_REST_KEY);
	if (!part1 || !rest) throw new Error('Enter both local ZIP base URLs.');
	return { part1: normalizeZipBase(part1), rest: normalizeZipBase(rest) };
}
{
	const part1Input = document.getElementById('local-zip-part1');
	const restInput = document.getElementById('local-zip-rest');
	part1Input.value = localStorage.getItem(LOCAL_ZIP_PART1_KEY) || '';
	restInput.value = localStorage.getItem(LOCAL_ZIP_REST_KEY) || '';
	const cacheInput = document.getElementById('cache-game-files');
	cacheInput.checked = cacheEnabled;
	cacheInput.addEventListener('change', () => {
		localStorage.setItem(CACHE_MODE_KEY, cacheInput.checked ? '1' : '0');
		q.set('cache', cacheInput.checked ? '1' : '0');
		q.delete('nocache');
		q.delete('nosw');
		location.search = q.toString();
	});
	if (localZipMode) document.getElementById('local-zip-settings').open = true;
	document.getElementById('local-zip-form').addEventListener('submit', (event) => {
		event.preventDefault();
		try {
			const part1Base = normalizeZipBase(part1Input.value.trim());
			const restBase = normalizeZipBase(restInput.value.trim());
			localStorage.setItem(LOCAL_ZIP_PART1_KEY, part1Base);
			localStorage.setItem(LOCAL_ZIP_REST_KEY, restBase);
			q.set('localzip', '1');
			q.delete('localzips');
			location.search = q.toString();
		} catch (error) {
			failStartup(error.message);
		}
	});
	document.getElementById('clear-local-zip').addEventListener('click', () => {
		localStorage.removeItem(LOCAL_ZIP_PART1_KEY);
		localStorage.removeItem(LOCAL_ZIP_REST_KEY);
		q.set('localzip', '0');
		q.delete('localzips');
		location.search = q.toString();
	});
}
let startupFailed = false;
function failStartup(message) {
	startupFailed = true;
	const hud = document.getElementById('hud');
	hud.classList.add('startup-error');
	hud.setAttribute('role', 'alert');
	hud.textContent = message;
	document.getElementById('ls-bars')?.setAttribute('hidden', '');
}
if (localZipMode) {
	try {
		getLocalZipBases();
	} catch (error) {
		document.getElementById('local-zip-settings').open = true;
		failStartup(error.message + ' Save them before starting the game.');
	}
}
const BASE = '';
const remoteLog = q.get('log') === '1';
const postLog = (text) => { if (remoteLog) fetch('/log', { method: 'POST', body: text }).catch(() => {}); };

{
	let posted = 0;
	new BroadcastChannel('game-crash').onmessage = (ev) => {
		const m = ev.data;
		const memory = /memory|OOM|Aborted\(|RangeError|grow/i.test(m.text);
		const dev = ' deviceMemory ' + (navigator.deviceMemory || '?') + ' GB, cores ' + navigator.hardwareConcurrency;
		if (remoteLog && posted++ < 3) fetch('/log', { method: 'POST', body: '[page] CRASH (' + m.kind + ', ' + m.thread + ' thread, wasm heap ' + m.heap + ' MB,' + dev + ', ' + location.search + '): ' + m.text + '\n' + m.tail.join('\n') + '\n' }).catch(() => {});
		const el = document.getElementById('hud');
		if (el) { el.textContent = 'The game stopped (' + m.kind + '): ' + m.text.split('\n')[0].slice(0, 200) + (memory ? ' - this looks like a lack of memory: close other tabs and reload.' : ' - reload the page.'); el.style.color = '#f96'; }
	};
}

let stopTitle = () => {};
{
	const stage = document.getElementById('ls-stage'), holder = document.getElementById('ls-screens');
	const titleAssetUrls = new Map();
	const titleAssetsReady = new Promise((resolve) => {
		const channel = new BroadcastChannel('game-progress');
		channel.addEventListener('message', (event) => {
			if (event.data?.assetsReady) {
				channel.close();
				resolve();
			}
		});
	});
	const titleAssetUrl = async (name) => {
		const path = 'b/8b0b5899ed/title/art/' + name + '.webp';
		if (!titleAssetUrls.has(path)) {
			titleAssetUrls.set(path, (async () => {
				await titleAssetsReady;
				const root = await navigator.storage.getDirectory();
				let directory = root;
				const parts = path.split('/');
				for (const part of parts.slice(0, -1)) directory = await directory.getDirectoryHandle(part);
				const file = await (await directory.getFileHandle(parts[parts.length - 1])).getFile();
				return URL.createObjectURL(file);
			})());
		}
		return titleAssetUrls.get(path);
	};
	const fit = () => {
		const s = Math.min(innerWidth / 1280, innerHeight / 720);
		stage.style.transform = 'translate(' + (innerWidth - 1280 * s) / 2 + 'px,' + (innerHeight - 720 * s) / 2 + 'px) scale(' + s + ')';
	};
	fit();
	addEventListener('resize', fit);
	const L = (tex, w, h, x, y, yr, to) => ({ tex, w, h, x, y, yr, to });
	const BG = (n, yr, to, x = 98) => L('ls' + n + '_background', 1024, 512, x, 95, yr, to);
	const FG = (n, name, w, h, x, y, toX, yr = 0) => L('ls' + n + '_' + name, w, h, x, y, yr, { x: toX });
	const SCREENS = [
		[L('beach_bg', 1024, 512, 98, 95, 20, { yr: -6, xr: 5 }), L('beach_fg', 343, 629, 480, 95, 0, { x: 720 })],
		null,
		[BG(0, 7, { yr: -7 }), FG(0, 'foreground', 299, 599, 360, 140, 560, 7)],
		[BG(1, 6, { yr: -12 }), FG(1, 'foreground', 503, 206, 300, 465, 480), FG(1, 'foreground_franklin', 368, 588, 440, 140, 745)],
		[BG(2, 7, { yr: -5, xr: 5 }), FG(2, 'foreground', 311, 558, 745, 200, 450), FG(2, 'foreground_chop', 320, 512, 640, 260, 310)],
		[BG(3, 12, { yr: -4 }, 110), FG(3, 'foreground', 412, 609, 440, 120, 730)],
		[BG(4, 7, { yr: -4, xr: 5 }), FG(4, 'foreground', 251, 643, 400, 85, 250)],
		[BG(5, 7, { yr: -6 }), FG(5, 'foreground', 389, 640, 450, 95, 700)],
		[BG(6, 7, { yr: 0, xr: 5 }), FG(6, 'foreground', 367, 603, 410, 115, 800)],
		[BG(7, 6, { yr: -6, xr: 5 }), FG(7, 'foreground', 311, 625, 860, 95, 520)],
		[BG(8, 7, { yr: -5, xr: 5 }), FG(8, 'foreground', 492, 497, 400, 190, 660)],
		[BG(9, 7, { yr: -3, xr: 5 }), FG(9, 'foreground', 331, 675, 220, 50, 140)],
		[BG(10, 6, { yr: -5, xr: 5 }), FG(10, 'foreground', 352, 682, 545, 65, 485)],
		[BG(11, 7, { yr: -3, xr: 5 }), FG(11, 'foreground', 344, 669, 309, 51, 424)],
		[BG(12, 6, { yr: -4 }), FG(12, 'foreground_michael', 462, 677, 345, 42, 220)],
		[BG(13, 5, { yr: -6, xr: 5 }), FG(13, 'foreground', 399, 681, 430, 39, 250)],
		[BG(14, 6, { yr: -2, xr: 5 }), FG(14, 'foreground', 392, 631, 650, 95, 850)],
		[BG(15, 6, { yr: -3, xr: 5 }), FG(15, 'foreground', 385, 642, 404, 78, 261)],
		[BG(16, 6, { yr: -3, xr: 5 }), FG(16, 'foreground', 300, 600, 300, 150, 400)],
	];
	const ORDERS = [[0, 16, 18, 3, 12, 2, 17, 10, 9, 8, 15, 6, 11, 14, 4, 7, 13], [0, 4, 6, 17, 11, 16, 18, 7, 9, 15, 3, 14, 10, 13, 2, 8, 12],
		[0, 7, 16, 14, 13, 3, 10, 2, 15, 18, 8, 9, 4, 17, 12, 6, 11], [0, 8, 18, 9, 13, 4, 11, 14, 7, 17, 6, 12, 3, 16, 2, 15, 10],
		[0, 11, 12, 7, 18, 14, 9, 13, 4, 2, 15, 11, 8, 16, 6, 3, 17], [0, 10, 16, 2, 13, 17, 8, 9, 18, 3, 12, 6, 7, 4, 14, 15, 10]];
	const order = ORDERS[Math.floor(Math.random() * ORDERS.length)];
	const cubicInOut = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(2 - 2 * t, 3) / 2);
	const slide = (s, x) => {
		s.el.style.transform = 'translateX(' + x + 'px)';
		for (const c of s.cams) c.style.perspectiveOrigin = (640 - x) + 'px 360px';
	};
	const place = (l, x, yr, xr) => { l.el.style.transform = 'translate3d(' + x + 'px,' + l.y + 'px,0) rotateY(' + -yr + 'deg) rotateX(' + -xr + 'deg)'; };
	const prepare = async (i) => {
		const layers = await Promise.all(SCREENS[order[i]].map(async (d) => {
			const img = new Image();
			try {
				img.src = await titleAssetUrl(d.tex);
			} catch (error) {
				console.error('[title] Could not load extracted artwork ' + d.tex + ':', error);
			}
			return { ...d, img };
		}));
		await Promise.all(layers.map((l) => l.img.decode().catch(() => {})));
		return layers;
	};
	let active = null, leaving = null, index = 0, alt = -1, timer = 0, raf = 0, stopped = false;
	const show = (defs) => {
		const now = performance.now();
		alt = alt <= 0 ? 1 : -1;
		const el = document.createElement('div');
		el.className = 'ls-screen';
		const cams = [];
		const s = { el, slideFrom: alt * 1280, start: now, settled: 0, cams, layers: defs.map((d) => {
			const cam = document.createElement('div'), e = document.createElement('div');
			cam.className = 'ls-cam';
			e.className = 'ls-layer';
			e.style.width = d.w + 'px'; e.style.height = d.h + 'px';
			e.style.backgroundImage = 'url(' + d.img.src + ')';
			cam.appendChild(e);
			el.appendChild(cam);
			cams.push(cam);
			return { el: e, y: d.y, x0: d.x, yr0: d.yr, xr0: 0, x1: d.to.x ?? d.x, yr1: d.to.yr ?? d.yr, xr1: d.to.xr ?? 0 };
		}) };
		for (const l of s.layers) place(l, l.x0, l.yr0, l.xr0);
		slide(s, s.slideFrom);
		holder.appendChild(el);
		if (leaving) leaving.el.remove();
		leaving = active;
		if (leaving) { leaving.slideFrom = 0; leaving.slideTo = -alt * 1280; leaving.start = now; }
		active = s;
		s.slideTo = 0;
	};
	const tick = (now) => {
		for (const s of [leaving, active]) {
			if (!s) continue;
			const p = Math.min(1, (now - s.start) / 850);
			if (p < 1 || !s.slid) { slide(s, s.slideFrom + (s.slideTo - s.slideFrom) * cubicInOut(p)); s.slid = p === 1; }
			if (s === active && p === 1 && !s.settled) s.settled = now;
			if (s.settled) {
				const q = Math.min(1, (now - s.settled) / 42000);
				for (const l of s.layers) place(l, l.x0 + (l.x1 - l.x0) * q, l.yr0 + (l.yr1 - l.yr0) * q, l.xr0 + (l.xr1 - l.xr0) * q);
			}
			if (s === leaving && p === 1) { s.el.remove(); leaving = null; }
		}
		if (!stopped) raf = requestAnimationFrame(tick);
	};
	let next = prepare(0);
	const cycle = () => next.then((defs) => {
		if (stopped) return;
		show(defs);
		index = (index + 1) % order.length;
		next = prepare(index);
		timer = setTimeout(cycle, 14000);
	});
	timer = setTimeout(cycle, 500);
	raf = requestAnimationFrame(tick);
	stopTitle = () => {
		stopped = true;
		clearTimeout(timer);
		cancelAnimationFrame(raf);
		for (const url of titleAssetUrls.values()) url.then((assetUrl) => URL.revokeObjectURL(assetUrl)).catch(() => {});
		titleAssetUrls.clear();
	};
}

let startMode = q.get('mode') === 'story' ? 1 : q.get('mode') === 'sandbox' ? (q.get('map') === 'env_test' ? 3 : 2) : 0;
let startModeWord = null, startCommitted = false, pickingMap = false, waitingChoice = false;
const ACTS = {
	back: ['Back', 'Backspace', ['Backspace']],
	map5: ['GTA V Map', '5', ['Digit5', 'Numpad5']],
	map6: ['GTA VI Map', '6', ['Digit6', 'Numpad6']],
	sandbox: ['Sandbox Mode', 'Space', ['Space']],
	story: ['Story Mode', 'Enter', ['Enter', 'NumpadEnter']],
};
const LOADING = { 1: 'Loading Story Mode', 2: 'Loading Sandbox Mode: GTA V Map', 3: 'Loading Sandbox Mode: GTA VI Map' };
const modesEl = document.getElementById('modes'), modeButtons = [...modesEl.querySelectorAll('button')];
const isMode = (act) => act === 'story' || act === 'sandbox';
const showModes = () => {
	for (const b of modeButtons) {
		const act = b.dataset.act, loading = !pickingMap && (act === 'story' ? startMode === 1 : act === 'sandbox' && startMode >= 2);
		const text = document.createElement('span'), icon = document.createElement(loading ? 'i' : 'span');
		text.textContent = loading ? LOADING[startMode] : ACTS[act][0];
		icon.className = loading ? 'ls-spin' : 'ls-key';
		icon.textContent = loading ? '' : ACTS[act][1];
		b.replaceChildren(text, icon);
		b.style.order = loading ? 1 : 0;
		b.disabled = startCommitted;
		b.hidden = startCommitted ? !loading : pickingMap === isMode(act);
		b.classList.toggle('chosen', loading);
	}
	if (startMode) modesEl.classList.remove('ask');
	if (waitingChoice && !startMode) document.getElementById('label').textContent = pickingMap ? 'Choose a map to continue' : 'Choose Story Mode or Sandbox Mode to continue';
};
const choose = (m) => {
	pickingMap = false;
	if (m !== startMode) {
		startMode = m;
		if (startModeWord) Atomics.store(startModeWord, 0, m);
		postLog('[page] start mode: ' + ({ 1: 'story', 2: 'sandbox', 3: 'sandbox on env_test' })[m]);
	}
	showModes();
};
const act = (a) => {
	if (startCommitted) return;
	if (a === 'story') choose(1);
	else if (a === 'map5') choose(2);
	else if (a === 'map6') choose(3);
	else { pickingMap = a === 'sandbox'; showModes(); }
};
modesEl.addEventListener('click', (e) => { const b = e.target.closest('button'); if (b && !b.hidden) act(b.dataset.act); });
addEventListener('keydown', (e) => {
	if (startCommitted || e.ctrlKey || e.altKey || e.metaKey || !document.getElementById('loading')) return;
	const b = modeButtons.find((x) => !x.hidden && ACTS[x.dataset.act][2].includes(e.code));
	if (!b) return;
	act(b.dataset.act);
	e.preventDefault(); e.stopImmediatePropagation();
}, { capture: true });
showModes();

{
	const loading = document.getElementById('loading'), fill = document.getElementById('fill'), label = document.getElementById('label'), pct = document.getElementById('pct');
	let target = 0, shown = 0, ready = false, dirty = false, loadingGone = false;
	let dataBytes = 0, worldBase = -1;
	const samples = [];
	let lastLine = '';
	const consoleEl = document.getElementById('console');
	const bc = new BroadcastChannel('game-progress');
	let lastActivity = performance.now(), stallLogged = 0, lastLabel = '';
	bc.onmessage = (ev) => {
		if (startupFailed) return;
		const m = ev.data;
		lastActivity = performance.now();
		if (m.dl) {
			dataBytes += m.dl;
			samples.push([performance.now(), m.dl]);
			return;
		}
		if (m.lines) {
			if (loadingGone || !m.lines.length) return;
			lastLine = m.lines[m.lines.length - 1];
			dirty = true;
			return;
		}
		if (m.gpuLost) { hud.textContent = 'The graphics device was lost (' + m.gpuLost + '): the screen will stay black. Reload the page.'; hud.style.color = '#f66'; return; }
		if (m.error) { failStartup(m.error); return; }
		if (m.pct > target) { target = m.pct; if (m.label) { lastLabel = m.label; if (!waitingChoice) label.textContent = m.label; } if (m.pct >= 72 && worldBase < 0) worldBase = dataBytes; }
		if (m.choice && !startMode) { waitingChoice = true; modesEl.classList.add('ask'); showModes(); }
		if (m.commit) { startCommitted = true; pickingMap = false; if (m.mode) startMode = m.mode; showModes(); }
		if (m.compiling !== undefined && !waitingChoice) { label.textContent = lastLabel = 'Preparing shaders'; target = Math.max(target, 99); }
		if (m.world) { ready = true; hud.textContent = 'click the game to capture the mouse (Esc releases it, Shift+P switches keyboard mode, = shows FPS)'; setTimeout(() => { hud.textContent = ''; }, 15000); }
	};

	const dataEl = document.getElementById('data');
	const WORLD_BYTES = 1.2e9;
	const stallTimer = setInterval(() => {
		if (startupFailed) { clearInterval(stallTimer); return; }
		if (ready) return;
		if (waitingChoice) { if (!startMode) { lastActivity = performance.now(); return; } waitingChoice = false; label.textContent = lastLabel; }
		const quiet = (performance.now() - lastActivity) / 1000;
		if (quiet > 30) {
			label.textContent = 'No progress for ' + (quiet | 0) + ' s' + (lastLabel ? ' (last step: ' + lastLabel + ')' : '') + ': the device may be out of memory. Close other tabs, or reload.';
			label.style.color = '#e96';
			if (quiet - stallLogged > 30) { stallLogged = quiet; postLog('[page] STALL: no progress for ' + (quiet | 0) + ' s, last step "' + lastLabel + '", shown ' + shown.toFixed(0) + '%'); }
		} else if (stallLogged) { stallLogged = 0; label.style.color = ''; }
	}, 2000);
	const progressTimer = setInterval(() => {
		if (startupFailed) { clearInterval(progressTimer); return; }
		const now = performance.now();
		while (samples.length && now - samples[0][0] > 3000) samples.shift();
		const speed = samples.reduce((a, x) => a + x[1], 0) / 3;
		if (dataBytes) dataEl.textContent = 'Game data: ' + (dataBytes / 1048576 | 0) + ' MB' + (speed > 1e4 ? ' (' + (speed / 1048576).toFixed(1) + ' MB/s)' : '');
		if (worldBase >= 0 && !ready) target = Math.max(target, 72 + 26 * Math.min(1, (dataBytes - worldBase) / WORLD_BYTES));
		const cap = ready ? 100 : Math.min(99, target + 6);
		const goal = ready ? 100 : (shown < target ? target : cap);
		shown += (goal - shown) * (goal === target || ready ? 0.12 : 0.004);
		if (dirty) {
			dirty = false;
			consoleEl.textContent = lastLine;
		}
		fill.style.width = shown.toFixed(1) + '%';
		pct.textContent = Math.round(shown) + '%';
		if (ready && shown > 99.5) { loading.classList.add('done'); setTimeout(() => { loading.remove(); stopTitle(); }, 1000); loadingGone = true; clearInterval(progressTimer); }
	}, 50);
}
const hud = document.getElementById('hud');

{
	const el = document.getElementById('fps');
	let on = false;
	new BroadcastChannel('game-fps').onmessage = (ev) => { if (on) el.textContent = Math.round(ev.data.fps) + ' FPS'; };
	const isToggle = (e) => e.code === 'Equal' && !e.ctrlKey && !e.altKey && !e.metaKey;
	addEventListener('keydown', (e) => {
		if (!isToggle(e)) return;
		e.stopImmediatePropagation(); e.preventDefault();
		if (e.repeat) return;
		on = !on;
		el.style.display = on ? 'block' : 'none';
		if (on) el.textContent = '-- FPS';
	}, { capture: true });
	addEventListener('keyup', (e) => { if (isToggle(e)) { e.stopImmediatePropagation(); e.preventDefault(); } }, { capture: true });
}
const canvas = document.getElementById('canvas');

const workerDiagnostics = new BroadcastChannel('game-log');
workerDiagnostics.onmessage = (ev) => {
	if (typeof ev.data === 'string') console.info('[worker]', ev.data);
};
if (remoteLog) {
	const queue = [];
	let sending = false;
	const pump = async () => {
		if (sending || !queue.length) return;
		sending = true;
		const body = queue.splice(0).join('\n');
		try { await fetch('/log', { method: 'POST', body, keepalive: body.length < 60000 }); } catch (e) { }
		sending = false;
		pump();
	};
	new BroadcastChannel('game-log').onmessage = (ev) => { queue.push(ev.data); if (queue.length > 20000) queue.splice(0, queue.length - 20000); pump(); };
}

addEventListener('pagehide', () => { try { new BroadcastChannel('game-io').postMessage('close'); } catch (e) {} });

async function dropOldCache() {
	try {
		if ('serviceWorker' in navigator) for (const r of await navigator.serviceWorker.getRegistrations()) await r.unregister();
		if (window.caches) for (const k of await caches.keys()) if (k.startsWith('gamedata')) await caches.delete(k);
	} catch (e) { console.warn('could not remove the old cache: ' + e); }
}
function supportsMemory64() {
	const probe = Uint8Array.of(
		0x00, 0x61, 0x73, 0x6d, 0x01, 0x00, 0x00, 0x00,
		0x04, 0x04, 0x01, 0x70, 0x04, 0x01,
		0x05, 0x04, 0x01, 0x07, 0x01, 0x01,
	);
	if (!WebAssembly.validate(probe)) return false;
	try {
		new WebAssembly.Memory({ address: 'i64', initial: 1n, maximum: 1n, shared: true });
		return true;
	} catch {
		return false;
	}
}
let lowMemory = false;
let startSize = [1280, 720], wantSize = null;

// Start the loader worker after validating browser support and local ZIP settings.
function launchLoaderWorker() {
	let localZipBases = null;
	if (localZipMode) {
		try {
			localZipBases = getLocalZipBases();
		} catch (error) {
			document.getElementById('local-zip-settings').open = true;
			failStartup(error.message + ' Save them before starting the game.');
			return;
		}
	}
	if (!crossOriginIsolated || typeof SharedArrayBuffer !== 'function') {
		failStartup('Shared memory requires HTTPS (or localhost) and COOP/COEP headers.');
		return;
	} else if (typeof WebAssembly === 'undefined' || typeof canvas.transferControlToOffscreen !== 'function') {
		failStartup('This game needs WebAssembly and OffscreenCanvas.');
		return;
	}

	const appleMobile = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
	const memory32 = q.get('memory') === '32' || appleMobile || !supportsMemory64();
	console.info(`[page] Game-file cache: ${cacheEnabled ? 'enabled (OPFS cached blocks; network misses are stored)' : 'disabled (direct network reads)'}.`);
	console.info(`[page] Startup options: local ZIP ${localZipMode ? 'enabled' : 'disabled'}, low-memory preference ${q.get('low') || 'automatic'}, query ${location.search || '(none)'}.`);
	const offscreen = canvas.transferControlToOffscreen();
	dropOldCache();

	const lowParam = q.get('low');
	lowMemory = lowParam === '1' || (lowParam !== '0' && (memory32 || (navigator.deviceMemory && navigator.deviceMemory <= 4)));
	const LOW_ARGS = ['-textureQuality=0', '-pedVariety=0', '-vehicleVariety=0', '-shadowQuality=' + (q.get('shadows') === '1' ? 0 : -1), '-reflectionQuality=0', '-particleQuality=0',
		'-grassQuality=0', '-cityDensity=0', '-lodScale=0', '-pedLodBias=0', '-vehicleLodBias=0'];
	const cores = +(q.get('cores') || 0) || (lowMemory ? 2 : navigator.hardwareConcurrency);
	if (lowMemory) hud.textContent = 'Low-memory device (' + (navigator.deviceMemory || '?') + ' GB reported): close other tabs.';
	postLog('[page env] ' + JSON.stringify({ deviceMemory: navigator.deviceMemory, cores: navigator.hardwareConcurrency, usingCores: cores, low: lowMemory, memory32, isolated: crossOriginIsolated, ua: navigator.userAgent.slice(0, 120), screen: screen.width + 'x' + screen.height + '@' + devicePixelRatio }));

	wantSize = () => {
		const forced = /^(\d+)x(\d+)$/.exec(q.get('res') || '');
		if (forced) return [+forced[1], +forced[2]];
		const sc = Math.max(0.25, Math.min(2, +(q.get('scale') || 1)));
		let w = innerWidth * devicePixelRatio * sc, h = innerHeight * devicePixelRatio * sc;
		const cap = lowMemory ? [2560, 1440] : [3840, 2160], k = Math.min(1, cap[0] / w, cap[1] / h);
		w *= k; h *= k;
		return [Math.max(320, Math.round(w / 2) * 2), Math.max(240, Math.round(h / 2) * 2)];
	};
	startSize = wantSize();
	const LOG_ARGS = q.get('verbose') ? [] : ['-Script_all=warning', '-replay_all=warning'];
	const ENGINE_ARGS = ['-fastscriptcore'];
	const tickTimer = setInterval(() => {}, 1);

	const workerUrl = new URL('/loader.js', location.origin);
	if (localZipBases) {
		workerUrl.searchParams.set('localzip', '1');
		workerUrl.searchParams.set('zip1', localZipBases.part1);
		workerUrl.searchParams.set('ziprest', localZipBases.rest);
	}
	console.info('[page] Starting loader worker:', workerUrl.pathname);
	const worker = new Worker(workerUrl);
	worker.onmessage = (ev) => {
		if (ev.data.error) {
			console.error('[page] Loader startup failed:', ev.data.error);
			failStartup(ev.data.error);
			clearInterval(tickTimer);
			worker.terminate();
			return;
		}
		if (ev.data.hud) hud.textContent = ev.data.hud;
		if (ev.data.input) installInput(ev.data.input.memory, ev.data.input.block);
		if (ev.data.audio) { audioPending = ev.data.audio; tryStartAudio(); }
	};
	worker.onerror = (e) => {
		const location = e.filename ? ` at ${e.filename}:${e.lineno || 0}:${e.colno || 0}` : ` (${workerUrl.pathname})`;
		const detail = e.message || e.type || 'unknown worker error';
		console.error('[page] Loader worker error' + location + ': ' + detail, e.error || e);
		failStartup('Loader worker failed: ' + detail + location);
		clearInterval(tickTimer);
		worker.terminate();
	};

	worker.postMessage({
		canvas: offscreen,
		base: BASE,
		memory32,
		args: ['-rootdir=/game/', ...(q.get('nogpu') ? [] : ['-wgpu']), '-nodisplaycalibration', '-noSocialClub', '-pc:nosocialclub', ...(q.get('newgame') === '1' ? ['-noautoload'] : []), '-nonetwork', '-output', '-width=' + startSize[0], '-height=' + startSize[1], '-forceResolution', ...LOG_ARGS, ...ENGINE_ARGS, '-frameLimit=' + (q.get('fps') === '30' ? 2 : q.get('fps') === '0' ? 0 : 1),
		 ...(cores <= 2 ? ['-numCores=' + cores] : []), ...(lowMemory ? LOW_ARGS : []), ...(q.get('args') || '').split(',').filter(Boolean)],
		shotEvery: +(q.get('shot') || 0),
		shotRt: q.get('shotrt') === '1',
		noHints: q.get('nohints') === '1',
		noPack: q.get('nopack') === '1',
		gpuLimits: q.get('limits') || '',
		keepThreads: (q.get('keep') || '').split(',').reduce((m, g) => m | ({ replay: 1, net: 2, bink: 4, idle: 8 }[g] || 0), 0),
		cores,
		noStore: !cacheEnabled,
		fullConsole: !!q.get('console'),
		remoteLog,
		trace: !!q.get('trace'),
		slots: +(q.get('slots') || 0),
		syncPipelines: !!q.get('syncpipelines'),
		record: !!q.get('record'),
		lowMemory,
	}, [offscreen]);
}

if (!startupFailed) launchLoaderWorker();

if (remoteLog && (q.get('mem') || lowMemory) && performance.measureUserAgentSpecificMemory) {
	const report = async () => {
		try {
			const r = await performance.measureUserAgentSpecificMemory();
			const rows = r.breakdown.filter((b) => b.bytes > 1e6).map((b) => (b.bytes / 1048576 | 0) + ' MB ' + (b.types || []).join('+') + ' ' + (b.attribution || []).map((a) => (a.url || '').split('/').pop() + '/' + (a.scope || '')).join(','));
			postLog('[page mem] total ' + (r.bytes / 1048576 | 0) + ' MB; ' + rows.join(' | '));
		} catch (e) { postLog('[page mem] failed: ' + e); }
		setTimeout(report, 15000);
	};
	setTimeout(report, 15000);
}

let audioPending = null, audioGesture = false, audioStarted = false;
function tryStartAudio() {
	if (!audioPending || !audioGesture || audioStarted) return;
	audioStarted = true;
	(async () => {
		try {
			const ctx = new AudioContext({ sampleRate: 48000, latencyHint: 'interactive' });
			await ctx.audioWorklet.addModule(BASE + '/audio-worklet.js');
			const node = new AudioWorkletNode(ctx, 'game-audio', { numberOfInputs: 0, numberOfOutputs: 1, outputChannelCount: [2], processorOptions: audioPending });
			node.connect(ctx.destination);
			await ctx.resume();
			addEventListener('pointerdown', () => ctx.resume());
			addEventListener('keydown', () => ctx.resume());
			postLog('[page] audio started: ' + ctx.sampleRate + ' Hz');
		} catch (e) { audioStarted = false; postLog('[page] audio failed: ' + e); }
	})();
}
for (const type of ['pointerdown', 'keydown']) addEventListener(type, () => { audioGesture = true; tryStartAudio(); }, { capture: true });

const VK = {
	Backspace: 0x08, Tab: 0x09, Enter: 0x0D, NumpadEnter: 0xFD, Pause: 0x13, CapsLock: 0x14, Escape: 0x1B, Space: 0x20, PageUp: 0x21, PageDown: 0x22,
	End: 0x23, Home: 0x24, ArrowLeft: 0x25, ArrowUp: 0x26, ArrowRight: 0x27, ArrowDown: 0x28, PrintScreen: 0x2C, Insert: 0x2D, Delete: 0x2E,
	MetaLeft: 0x5B, MetaRight: 0x5C, ContextMenu: 0x5D, NumpadMultiply: 0x6A, NumpadAdd: 0x6B, NumpadSubtract: 0x6D, NumpadDecimal: 0x6E, NumpadDivide: 0x6F,
	NumLock: 0x90, ScrollLock: 0x91, ShiftLeft: 0xA0, ShiftRight: 0xA1, ControlLeft: 0xA2, ControlRight: 0xA3, AltLeft: 0xA4, AltRight: 0xA5,
	Semicolon: 0xBA, Equal: 0xBB, Comma: 0xBC, Minus: 0xBD, Period: 0xBE, Slash: 0xBF, Backquote: 0xC0, BracketLeft: 0xDB, Backslash: 0xDC, BracketRight: 0xDD,
	Quote: 0xDE, IntlBackslash: 0xE2,
};
for (let i = 0; i < 10; i++) { VK['Digit' + i] = 0x30 + i; VK['Numpad' + i] = 0x60 + i; }
for (let i = 0; i < 26; i++) VK['Key' + String.fromCharCode(65 + i)] = 0x41 + i;
for (let i = 1; i <= 24; i++) VK['F' + i] = 0x6F + i;

function installInput(memory, block) {
	const keys = new Uint8Array(memory.buffer, block, 256);
	const w = new Int32Array(memory.buffer, block + 256, 10);
	const U16 = new Uint16Array(memory.buffer, block + 256 + 40, 64);
	const MX = 0, MY = 1, DX = 2, DY = 3, DZ = 4, BTN = 5, FOCUS = 6, LOCKED = 7, HEAD = 8, TAIL = 9;
	let W = startSize[0], H = startSize[1];
	const ext = new Int32Array(memory.buffer, block + 424, 4);
	startModeWord = new Int32Array(memory.buffer, block + 440, 1);
	if (startMode) Atomics.store(startModeWord, 0, startMode);
	Atomics.store(ext, 2, W); Atomics.store(ext, 3, H);

	Atomics.store(w, FOCUS, document.hasFocus() ? 1 : 0);
	Atomics.store(w, MX, W >> 1);
	Atomics.store(w, MY, H >> 1);

	const passThrough = (e) => e.code === 'F12' || e.code === 'F11' || (e.ctrlKey && e.shiftKey && (e.code === 'KeyI' || e.code === 'KeyJ')) || e.code === 'F5';
	const FLY_ALIAS = { KeyI: 'Numpad8', KeyK: 'Numpad2', KeyJ: 'Numpad4', KeyL: 'Numpad6', KeyU: 'Numpad7', KeyO: 'Numpad9' };
	const held = new Set();
	const syncFlyAlias = () => { for (const [src, target] of Object.entries(FLY_ALIAS)) Atomics.store(keys, VK[target], held.has(src) || held.has(target) ? 0x80 : 0); };
	addEventListener('keydown', (e) => {
		if (passThrough(e)) return;
		e.preventDefault();
		const vk = VK[e.code];
		if (vk) Atomics.store(keys, vk, 0x80);
		held.add(e.code); syncFlyAlias();
		if (e.key.length === 1 && !e.ctrlKey && !e.metaKey) {
			const head = Atomics.load(w, HEAD);
			if (((head - Atomics.load(w, TAIL)) >>> 0) < 64) { U16[head & 63] = e.key.charCodeAt(0); Atomics.store(w, HEAD, (head + 1) | 0); }
		}
	});
	addEventListener('keyup', (e) => {
		if (passThrough(e)) return;
		e.preventDefault();
		const vk = VK[e.code];
		if (vk) Atomics.store(keys, vk, 0);
		held.delete(e.code); syncFlyAlias();
	});
	const releaseAll = () => { held.clear(); for (let i = 0; i < 256; i++) Atomics.store(keys, i, 0); Atomics.store(w, BTN, 0); };
	addEventListener('focus', () => { Atomics.store(w, FOCUS, 1); });
	addEventListener('blur', () => { Atomics.store(w, FOCUS, 0); releaseAll(); });

	const locked = () => document.pointerLockElement === canvas;
	canvas.addEventListener('mousedown', (e) => {
		if (!locked()) { canvas.requestPointerLock({ unadjustedMovement: true }).catch(() => canvas.requestPointerLock()); }
		Atomics.or(w, BTN, 1 << [0, 2, 1, 3, 4][e.button]);
		e.preventDefault();
	});
	addEventListener('mouseup', (e) => { Atomics.and(w, BTN, ~(1 << [0, 2, 1, 3, 4][e.button])); });
	addEventListener('contextmenu', (e) => e.preventDefault());
	document.addEventListener('pointerlockchange', () => { Atomics.store(w, LOCKED, locked() ? 1 : 0); });
	addEventListener('mousemove', (e) => {
		const r = canvas.getBoundingClientRect();
		if (locked()) {
			Atomics.add(w, DX, e.movementX);
			Atomics.add(w, DY, e.movementY);
			const x = Math.max(0, Math.min(W - 1, Atomics.load(w, MX) + e.movementX));
			const y = Math.max(0, Math.min(H - 1, Atomics.load(w, MY) + e.movementY));
			Atomics.store(w, MX, x);
			Atomics.store(w, MY, y);
		} else {
			const x = Math.max(0, Math.min(W - 1, Math.round((e.clientX - r.left) * W / r.width)));
			const y = Math.max(0, Math.min(H - 1, Math.round((e.clientY - r.top) * H / r.height)));
			Atomics.add(w, DX, x - Atomics.load(w, MX));
			Atomics.add(w, DY, y - Atomics.load(w, MY));
			Atomics.store(w, MX, x);
			Atomics.store(w, MY, y);
		}
	});
}
